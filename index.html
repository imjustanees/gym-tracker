<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gym Tracker</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <h1>Gym Tracker</h1>
    <p>Log your workouts and track your progress.</p>

    <section>
      <h2>Log an exercise</h2>

      <form id="exercise-form">
        <label for="exercise">Exercise name</label>
        <input
          id="exercise"
          type="text"
          placeholder="e.g. Bench press"
          maxlength="100"
          required
        >

        <label for="date">Workout date</label>
        <input id="date" type="date" required>

        <label for="sets">Sets</label>
        <input id="sets" type="number" min="1" step="1" required>

        <label for="reps">Reps per set</label>
        <input id="reps" type="number" min="1" step="1" required>

        <label for="weight">Weight (kg)</label>
        <input id="weight" type="number" min="0" step="0.5" required>

        <button type="submit">Save exercise</button>
      </form>
    </section>

    <section>
      <h2>Workout history</h2>
      <p id="exercise-count" role="status">0 entries</p>
      <ul id="exercise-list"></ul>
    </section>
  </main>
</body>
</html>
